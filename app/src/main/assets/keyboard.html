<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bellamie Keyboard</title>
<style>
:root{color-scheme:light;--keyboard-bg:#D1D5DB;--key-gray:#AEB5BF;--key-shadow:rgba(67,74,84,.42)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:283.2px;overflow:hidden;background:var(--keyboard-bg)}
body{font-family:"SF Pro","SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter",Roboto,Arial,sans-serif;display:block;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#screen{position:relative;width:390px;height:283.2px;transform-origin:top left;background:var(--keyboard-bg);overflow:hidden}
#kb{position:absolute;left:0;top:0;width:390px;height:283.2px;background:var(--keyboard-bg)}
.key{position:absolute;display:flex;align-items:center;justify-content:center;border:0;border-radius:5.5px;height:43.2px;color:#111;font-family:inherit;font-size:15.6pt;font-weight:400;line-height:1;user-select:none;-webkit-user-select:none;cursor:pointer;touch-action:manipulation;box-shadow:0 1.15px 0 var(--key-shadow);transition:background-color 65ms ease,box-shadow 65ms ease,transform 65ms ease}
.key:active{transform:translateY(1px);box-shadow:0 .15px 0 var(--key-shadow)}.white:active{background:#E4E7EC}.gray:active{background:#929BA8}
.white{background:#FAFAFC}.gray{background:var(--key-gray)}.letter{width:34.3px}.key svg{display:block}
.ico{position:absolute;color:#4F555C;pointer-events:none}.ico svg{display:block;width:100%;height:100%}
.key:focus-visible,.ico:focus-visible{outline:2px solid #2563eb;outline-offset:1px}
</style>
</head>
<body><div id="screen"><div id="kb" role="group" aria-label="Bellamie keyboard"></div></div>
<script>
(function(){
'use strict';
var kb=document.getElementById('kb'),screen=document.getElementById('screen');
function resizeKeyboard(){var scale=window.innerWidth/390;screen.style.transform='scale('+scale+')';document.documentElement.style.height=(283.2*scale)+'px';document.body.style.height=(283.2*scale)+'px'}
window.addEventListener('resize',resizeKeyboard);resizeKeyboard();
var rows=[
{y:6.8,keys:{Q:2.25,W:41.05,E:79.85,R:118.65,T:157.45,Y:196.25,U:235.05,I:273.85,O:312.65,P:351.45}},
{y:59.2,keys:{A:22.65,S:61.45,D:100.25,F:139.05,G:177.85,H:216.65,J:255.45,K:294.25,L:333.05}},
{y:112.4,keys:{Z:61.95,X:100.75,C:139.55,V:178.35,B:217.15,N:255.95,M:294.75}}
];
function add(el,x,y,w,cls){el.className='key '+cls;el.style.left=x+'px';el.style.top=y+'px';if(w)el.style.width=w+'px';el.type='button';el.addEventListener('mousedown',function(e){e.preventDefault()});kb.appendChild(el);return el}
rows.forEach(function(r){Object.keys(r.keys).forEach(function(ch){var b=document.createElement('button');b.textContent=ch;b.setAttribute('aria-label',ch);b.setAttribute('data-key',ch);add(b,r.keys[ch],r.y,0,'white letter')})});
function svgOpen(vb,w,h){return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+vb+'" width="'+w+'" height="'+h+'" fill="none" aria-hidden="true">'}
var shift=document.createElement('button');shift.setAttribute('aria-label','Shift');shift.innerHTML=svgOpen('0 0 24 24',24,24)+'<path d="M12 2.8 2.6 13.2h5.9v6.6c0 .6.4 1 1 1h5c.6 0 1-.4 1-1v-6.6h5.9z" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"/></svg>';add(shift,3.7,112.4,43,'white');
var bs=document.createElement('button');bs.setAttribute('aria-label','Delete');bs.innerHTML=svgOpen('0 0 28 22',26,20.4)+'<path d="M9 2.5h14.5a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H9L1.8 11z" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/><path d="M12.8 7.3l7.4 7.4M20.2 7.3l-7.4 7.4" stroke="#000" stroke-width="1.8" stroke-linecap="round"/></svg>';add(bs,343.3,112.4,43,'gray');
var num=document.createElement('button');num.textContent='123';add(num,3.7,164.7,43,'gray');num.style.fontSize='12pt';
var em=document.createElement('button');em.setAttribute('aria-label','Emoji');em.innerHTML=svgOpen('0 0 24 24',24,24)+'<circle cx="12" cy="12" r="9.4" stroke="#000" stroke-width="1.8"/><circle cx="8.8" cy="10" r="1.2" fill="#000"/><circle cx="15.2" cy="10" r="1.2" fill="#000"/><path d="M7.6 14.2c1.1 2.7 7.7 2.7 8.8 0" stroke="#000" stroke-width="1.8" stroke-linecap="round"/></svg>';add(em,53.7,164.7,43,'gray');
var sp=document.createElement('button');sp.textContent='space';add(sp,101.5,164.7,188.4,'white');sp.style.fontSize='12pt';
var rt=document.createElement('button');rt.textContent='return';add(rt,295.3,164.7,91,'gray');rt.style.fontSize='12pt';
function icon(x,y,w,h,html,label){var d=document.createElement('div');d.className='ico';d.setAttribute('role','button');d.setAttribute('aria-label',label);d.setAttribute('tabindex','0');d.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;pointer-events:auto;cursor:pointer;touch-action:manipulation';d.innerHTML=html;kb.appendChild(d);return d}
var globe=icon(25.6,229.9,29.2,29.3,'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29.2 29.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="14.6" cy="14.65" r="12.6"/><ellipse cx="14.6" cy="14.65" rx="5.4" ry="12.6"/><path d="M2 14.65h25.2M4.2 7.9h20.8M4.2 21.4h20.8"/></svg>','Switch language');
var voice=icon(340,229.9,20.4,30.1,'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20.4 30.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5.7" y="1.2" width="9" height="16.5" rx="4.5"/><path d="M1.6 13.2a8.6 8.6 0 0 0 17.2 0M10.2 21.8v6.6M5.6 28.6h9.2"/></svg>','Voice input');
var letters=Array.prototype.slice.call(kb.querySelectorAll('.letter'));
kb.querySelectorAll('.key').forEach(function(key){key.addEventListener('pointerdown',function(){if(window.AndroidKeyboard&&AndroidKeyboard.feedback)AndroidKeyboard.feedback()})});
var upper=true,shiftLocked=false,lastShiftAt=0,lastSpaceAt=0,kurdish=false,kuShift=false,layout='letters',inputMode='text',actionLabel='return',emojiPage=0;
var numberKeys=['1','2','3','4','5','6','7','8','9','0','@','#','$','%','&','-','+','(',')','*','"',"'",':',';','!','?'];
var symbolKeys=['[',']','{','}','#','%','^','*','+','=','_','\\','|','~','<','>','€','£','¥','.',',','?','!','"', "'",':'];
var emailKeys=['1','2','3','4','5','6','7','8','9','0','@','.','-','_','&','+','(',')','/','?',':',';','!','"',"'",'#'];
var urlKeys=['1','2','3','4','5','6','7','8','9','0','/','.',':','-','_','?','#','%','&','+','=','@','~','!','(',')'];
var emojiPages=[['😀','😂','🥹','😍','🥰','😘','😊','😉','😭','😎','🥳','🤔','🙄','😴','😡','👍','👎','👏','🙏','❤️','💔','🔥','✨','🎉','🌹','💯'],['👋','🤚','🖐️','✋','🫶','🤝','🙏','💪','🦾','👏','🙌','🤲','👌','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','👇','☝️','✍️','💅','🫰'],['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦋','🐢','🐬','🐳','🌸','🌹','🌈','🌍'],['🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🫐','🍒','🍑','🥭','🍍','🥥','🥝','🍅','🥑','🍕','🍔','🍟','🌮','🍰','☕','🧋','🚗','✈️'],['⌚','📱','💻','🎧','📷','💡','🔑','🔒','🎁','🎈','⚽','🏀','🎮','🎵','🎶','⭐','🌟','☀️','🌙','☁️','⚡','❄️','☔','✅','❌','💯']];
var KU={Q:'ق',W:'و',E:'ە',R:'ر',T:'ت',Y:'ی',U:'ئ',I:'ح',O:'ۆ',P:'پ',A:'ا',S:'س',D:'د',F:'ف',G:'گ',H:'هـ',J:'ژ',K:'ک',L:'ل',Z:'ز',X:'خ',C:'ج',V:'ڤ',B:'ب',N:'ن',M:'م'};
var KU2={Q:'ء',W:'وو',E:'ە',R:'ڕ',T:'ط',Y:'ێ',U:'ي',I:'ع',O:'ۆ',P:'ث',A:'آ',S:'ش',D:'ذ',F:'ظ',G:'غ',H:'هـ',J:'ژ',K:'ک',L:'ڵ',Z:'ض',X:'ص',C:'چ',V:'ڤ',B:'ب',N:'ن',M:'م'};
var shiftOn=shift.innerHTML,shiftOff=svgOpen('0 0 24 24',24,24)+'<path d="M12 2.8 2.6 13.2h5.9v6.6c0 .6.4 1 1 1h5c.6 0 1-.4 1-1v-6.6h5.9z" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/></svg>';
function updateCase(){
 var on=kurdish?kuShift:(upper||shiftLocked);
 letters.forEach(function(b,i){
  var k=b.getAttribute('data-key').toUpperCase(),v;
  if(layout==='numbers')v=(inputMode==='email'?emailKeys:inputMode==='url'?urlKeys:numberKeys)[i];
  else if(layout==='symbols')v=symbolKeys[i];
  else if(layout==='emoji')v=emojiPages[emojiPage][i];
  else v=kurdish?(kuShift?KU2[k]:KU[k]):(on?k:k.toLowerCase());
  b.textContent=v;b.setAttribute('data-v',v);b.setAttribute('aria-label',v);
  b.style.fontSize=layout==='emoji'?'21px':(layout==='numbers'||layout==='symbols'?'17px':'');
 });
 if(layout==='letters'){shift.innerHTML=on?shiftOn:shiftOff;shift.className='key '+(on?'white':'gray');shift.style.fontSize='';}
 else{shift.textContent=layout==='numbers'?'=\\<':'ABC';shift.className='key gray';shift.style.fontSize='12pt';}
 shift.setAttribute('aria-pressed',layout==='letters'&&on?'true':'false');
 num.textContent=layout==='letters'?(kurdish?'١٢٣':'123'):layout==='numbers'?'#+=':'ABC';
 sp.textContent=kurdish&&layout==='letters'?'بۆشایی':'space';
 bs.firstElementChild.style.transform=kurdish?'scaleX(-1)':'';
 rt.textContent=actionLabel;
 rt.setAttribute('aria-label',actionLabel==='return'?'Return':actionLabel);
}
function commit(v){if(window.AndroidKeyboard)AndroidKeyboard.commit(v)}
function refreshCaps(){if(!kurdish&&layout==='letters'&&window.AndroidKeyboard&&AndroidKeyboard.capsMode){var mode=AndroidKeyboard.capsMode();if(mode>=0){upper=mode>0;shiftLocked=false;updateCase()}}}
letters.forEach(function(b){b.addEventListener('click',function(){lastSpaceAt=0;var v=b.getAttribute('data-v');if(v==null)return;commit(v);if(layout==='letters'){if(kurdish){if(kuShift){kuShift=false;updateCase()}}else{shiftLocked=false;upper=false;updateCase();setTimeout(refreshCaps,30)}}})});
shift.addEventListener('click',function(){lastSpaceAt=0;
 if(inputMode==='number'||inputMode==='phone'){layout=layout==='numbers'?'symbols':'numbers';updateCase();return}
 if(layout==='numbers'){layout='symbols';updateCase();return}
 if(layout==='symbols'||layout==='emoji'){layout='letters';updateCase();return}
 if(kurdish){kuShift=!kuShift;updateCase();return}
 var now=Date.now();if(now-lastShiftAt<350){shiftLocked=!shiftLocked;upper=shiftLocked||upper}else{upper=!upper;shiftLocked=false}
 lastShiftAt=now;updateCase();
});
num.addEventListener('click',function(){lastSpaceAt=0;if(inputMode==='number'||inputMode==='phone'){layout=layout==='numbers'?'symbols':'numbers'}else if(layout==='letters')layout='numbers';else if(layout==='numbers')layout='symbols';else layout='letters';updateCase()});
em.addEventListener('click',function(){lastSpaceAt=0;if(layout==='emoji'){emojiPage=(emojiPage+1)%emojiPages.length}else{layout='emoji';emojiPage=0}updateCase()});
sp.addEventListener('click',function(){var now=Date.now(),eligible=!kurdish&&layout==='letters'&&inputMode==='text',doubleSpace=eligible&&lastSpaceAt>0&&now-lastSpaceAt<350;lastSpaceAt=doubleSpace?0:(eligible?now:0);if(window.AndroidKeyboard&&AndroidKeyboard.space)AndroidKeyboard.space(doubleSpace);else commit(doubleSpace?'. ':' ')});
rt.addEventListener('click',function(){if(window.AndroidKeyboard)AndroidKeyboard.enter()});
function del(){if(window.AndroidKeyboard)AndroidKeyboard.delete()}
var t1=null,t2=null;function stopDelete(){clearTimeout(t1);clearInterval(t2);t1=t2=null}
bs.addEventListener('pointerdown',function(e){e.preventDefault();stopDelete();del();t1=setTimeout(function(){t2=setInterval(del,70)},400)});
['pointerup','pointerleave','pointercancel','blur'].forEach(function(ev){bs.addEventListener(ev,stopDelete)});
bs.addEventListener('contextmenu',function(e){e.preventDefault()});
function toggleLang(){kurdish=!kurdish;kuShift=false;shiftLocked=false;upper=true;if(layout==='emoji')layout='letters';updateCase()}
globe.addEventListener('click',toggleLang);globe.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleLang()}});
voice.addEventListener('click',function(){if(window.AndroidKeyboard&&AndroidKeyboard.voice)AndroidKeyboard.voice(kurdish)});voice.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();if(window.AndroidKeyboard&&AndroidKeyboard.voice)AndroidKeyboard.voice(kurdish)}});
function setInputConfig(type,imeOptions,caps){
 type=Number(type)||0;imeOptions=Number(imeOptions)||0;caps=Number(caps)||0;
 var cls=type&15,variation=type&4080;
 inputMode='text';
 if(cls===2)inputMode='number';else if(cls===3)inputMode='phone';else if(cls===4)inputMode='number';
 else if(cls===1&&(variation===32||variation===208))inputMode='email';else if(cls===1&&variation===16)inputMode='url';else if(cls===1&&(variation===128||variation===144||variation===224))inputMode='password';
 if(inputMode==='number'||inputMode==='phone'){layout='numbers'}else if(layout==='numbers'||layout==='symbols')layout='letters';
 var action=imeOptions&255;
 actionLabel=action===2?'go':action===3?'search':action===4?'send':action===5?'next':action===6?'done':action===7?'previous':'return';
 if(!kurdish){upper=caps!==0;shiftLocked=false}
 updateCase();
}
window.configureInput=setInputConfig;
window.refreshCaps=refreshCaps;
window.resetForInput=function(){if(layout==='emoji')layout='letters';shiftLocked=false;upper=true;kuShift=false;updateCase();setTimeout(refreshCaps,40)};
updateCase();
})();
</script></body></html>
