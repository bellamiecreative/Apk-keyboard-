.keyPop{position:absolute;z-index:30;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.keyPopBubble,.keyPopStem{position:absolute;background:#FAFAFC}

/* ===== Password & Text Manager ===== */

.tft.multi::-webkit-scrollbar{display:none}
.caret{display:inline-block;width:0;height:18px;border-left:2px solid #007AFF;vertical-align:text-bottom;margin:0 -1px;animation:pmBlink 1s steps(1) infinite}
.tf.big{height:64px;align-items:flex-start;padding:3px 8px}
.tf.big .tfi{margin-top:2px}
.tfe,.tfx,.tfc,.tfp{flex:none;width:28px;height:26px;border:0;background:transparent;color:#6B6E76;padding:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation}

.pmSearchTf{flex:1;border-radius:17px}

.pmWide{margin:0 auto 18px;height:36px;padding:0 22px;border:0;border-radius:10px;background:#007AFF;color:#fff;font-size:15px;font-family:inherit}
.pmEd{top:0px;height:134px;z-index:20;background:#EBECF2}

.dlgMsg{margin-top:3px;font-size:13px;line-height:17px;color:#5C5F67}
.dlgBtns{display:flex;gap:8px;margin-top:10px}
.dlgBtn{flex:1;height:36px;border:0;border-radius:9px;background:#E8EAF0;color:#007AFF;font-family:inherit;font-size:15px;font-weight:500}
.dlgBtn.danger{background:#FF3B30;color:#fff}
.dlgBtn:active{opacity:.7}
.pmToast{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:50;max-width:340px;padding:6px 12px;border-radius:15px;background:rgba(40,42,48,.93);color:#fff;font-size:13px;line-height:18px;white-space:nowrap;display:none;pointer-events:none}
@keyframes pmBlink{50%{opacity:0}}

</style>

  if(typeof NB.copyText!=='function'){done('unavailable');return}
  var r;try{r=JSON.parse(NB.copyText(text,!!secret))}catch(x){done('bridge');return}

}

  if(typeof NB.pasteText!=='function'){done('unavailable');return}

  if(r&&r.ok)done(null,String(r.text||''));else done((r&&r.error)||'clip_failed');return
 }

}
function startDrag(e,row,grip){
 var rows=[].slice.call(pmList.querySelectorAll('.pmRow'));if(rows.length<2)return;
 var i0=rows.indexOf(row),cur=i0,n=rows.length,step=row.offsetHeight+GAP,k=(screen.getBoundingClientRect().width/390)||1,y0=e.clientY,s0=pmList.scrollTop,ly=e.clientY,raf=0,done=false;
 e.preventDefault();try{grip.setPointerCapture(e.pointerId)}catch(x){}
 row.classList.add('drag');
 function apply(){
  var dy=(ly-y0)/k+(pmList.scrollTop-s0);dy=Math.max(-i0*step,Math.min((n-1-i0)*step,dy));
  row.style.transform='translateY('+dy+'px)';
  var to=Math.max(0,Math.min(n-1,Math.round(i0+dy/step)));
  if(to!==cur){cur=to;rows.forEach(function(r,j){if(r===row)return;var s=0;if(cur>i0&&j>i0&&j<=cur)s=-step;else if(cur<i0&&j<i0&&j>=cur)s=step;r.style.transform=s?'translateY('+s+'px)':''})}
 }
 function tick(){if(done)return;var r=pmList.getBoundingClientRect();if(ly<r.top+26)pmList.scrollTop-=7;else if(ly>r.bottom-26)pmList.scrollTop+=7;apply();raf=requestAnimationFrame(tick)}
 function mv(ev){ly=ev.clientY}
 function end(){
  if(done)return;done=true;cancelAnimationFrame(raf);
  grip.removeEventListener('pointermove',mv);grip.removeEventListener('pointerup',end);grip.removeEventListener('pointercancel',end);
  var order=rows.slice();order.splice(i0,1);order.splice(cur,0,row);
  rows.forEach(function(r){r.style.transition='none';r.style.transform=''});row.classList.remove('drag');
  if(cur!==i0)commitOrder(order.map(function(r){return r.getAttribute('data-uid')}))
 }
 grip.addEventListener('pointermove',mv);grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',end);
 raf=requestAnimationFrame(tick)
}
pmList.addEventListener('pointerdown',function(e){var g=e.target.closest?e.target.closest('.pmGrip'):null;if(g)startDrag(e,g.closest('.pmRow'),g)});
pmList.addEventListener('contextmenu',function(e){e.preventDefault()});

/* ---- open / close / search / editor ---- */
function openManager(kind){
 PM.kind=kind;PM.mode='list';PM.query='';PM.rev=null;PM.edit=null;PM.openedAt=Date.now();
 searchF.focused=false;searchF.val='';searchF.pos=0;searchF.render();
 pmPanel.style.height='283.2px';pmPanel.style.display='block';pmEd.style.display='none';
 pmPanel.querySelector('#pmAdd').setAttribute('aria-label',kind==='pw'?'Add password':'Add text');
 loadData();render()
}
function closeManager(fromReset){
 clearReveal();hideDlg();edStop(!!fromReset);
 pmPanel.style.display='none';pmEd.style.display='none';pmToast.style.display='none';edBody.innerHTML='';
 PM.kind=null;PM.mode='list';PM.edit=null;PM.data=[];PM.query='';setExtra(0)
}
function pmReset(){if(PM.kind||ed.active||pmMenu.style.display==='block'){hideMenu();closeManager(true)}}
function enterSearch(){
 if(PM.mode!=='list'||PM.err)return;
 PM.mode='search';pmPanel.style.height=EXTRA+'px';setExtra(EXTRA);
 edStart([searchF],function(){exitSearch()})
}
function exitSearch(){
 if(PM.mode!=='search')return;
 edStop(false);PM.mode='list';pmPanel.style.height='283.2px';setExtra(0);render()
}
function snapshot(F){return F.map(function(f){return f.val}).join('\u0001')}
function openEditor(rec){
 var pw=PM.kind==='pw',v={id:'',email:'',pass:'',text:''};
 if(rec){
  if(pw){var g=nat('pw','get',rec.uid);if(!g.ok){toast(errMsg(g.error));return}v.id=g.record.id;v.email=g.record.email;v.pass=g.record.pass}
  else{v.id=rec.id;v.text=rec.text}
 }
 clearReveal();hideDlg();if(ed.active)edStop(false);
 PM.mode='edit';PM.edit={uid:rec?rec.uid:'',fields:null,init:''};
 pmPanel.style.display='none';pmEd.style.display='block';
 edTitle.textContent=(rec?'Edit ':'New ')+(pw?'password':'text');
 function fh(icon,eye,big){return '<div class="tf'+(big?' big':'')+'"><span class="tfi">'+ic(icon)+'</span><div class="tft'+(big?' multi':'')+'" dir="auto"></div><span class="tfa"><button type="button" class="tfc" aria-label="Copy">'+ic('copy')+'</button><button type="button" class="tfp" aria-label="Paste">'+ic('paste')+'</button>'+(eye?'<button type="button" class="tfe" aria-label="Show password">'+ic('eye')+'</button>':'')+'</span></div>'}
 var F;
 if(pw){
  edBody.innerHTML=fh('tag')+fh('mail')+fh('lock',true);
  var tf=edBody.querySelectorAll('.tf');
  F=[mkField(tf[0],{ph:'ID (e.g. Google)',max:200,autocap:true,val:v.id}),mkField(tf[1],{ph:'Email or username',max:500,val:v.email}),mkField(tf[2],{ph:'Password',max:1000,secret:true,val:v.pass})];
  var eye=tf[2].querySelector('.tfe');
  eye.addEventListener('click',function(e){e.stopPropagation();F[2].reveal=!F[2].reveal;eye.innerHTML=ic(F[2].reveal?'eyeoff':'eye');eye.setAttribute('aria-label',F[2].reveal?'Hide password':'Show password');F[2].render()})
 }else{
  edBody.innerHTML=fh('tag')+fh('doc',false,true);
  var t2=edBody.querySelectorAll('.tf');
  F=[mkField(t2[0],{ph:'ID (e.g. Email Signature)',max:200,autocap:true,val:v.id}),mkField(t2[1],{ph:'Text',max:TX_MAX,multi:true,autocap:true,val:v.text})]
 }
 PM.edit.fields=F;PM.edit.init=snapshot(F);
 setExtra(EXTRA);
 edStart(F,function(f){var i=F.indexOf(f);if(i<F.length-1)edFocus(F[i+1]);else saveEdit()});
 edFocus(F[0])
}
function closeEditor(){
 edStop(false);pmEd.style.display='none';edBody.innerHTML='';pmPanel.style.display='block';pmPanel.style.height='283.2px';
 PM.mode='list';PM.edit=null;setExtra(0);render()
}
function saveEdit(){
 if(!PM.edit)return;
 var F=PM.edit.fields,idv=F[0].val.trim();
 if(!idv){toast('Enter an ID first');edFocus(F[0]);F[0].root.classList.add('bad');setTimeout(function(){F[0].root.classList.remove('bad')},600);return}
 var rec=PM.kind==='pw'?{uid:PM.edit.uid,id:idv,email:F[1].val,pass:F[2].val}:{uid:PM.edit.uid,id:idv,text:F[1].val};
 var r=nat(PM.kind,'save',JSON.stringify(rec));
 if(!r.ok){toast(errMsg(r.error));return}
 PM.data=r.records;fb();closeEditor()
}
pmPanel.querySelector('#pmBack').addEventListener('click',function(){closeManager(false)});
pmPanel.querySelector('#pmAdd').addEventListener('click',function(){if(PM.err)return;fb();openEditor(null)});
pmPanel.querySelector('#pmClear').addEventListener('click',function(e){e.stopPropagation();searchF.setValue('')});
pmEd.querySelector('#edSave').addEventListener('click',saveEdit);
pmEd.querySelector('#edClose').addEventListener('click',function(){
 if(PM.edit&&snapshot(PM.edit.fields)!==PM.edit.init)confirmDlg('Discard changes?','Your edits won\u2019t be saved.','Discard',true,closeEditor);
 else closeEditor()
});

/* ---- Globe long-press menu ---- */
function showMenu(){if(ed.active||PM.kind)return;pmMenu.style.display='block';menuAt=Date.now();fb()}
function hideMenu(){pmMenu.style.display='none'}
pmMenu.addEventListener('click',function(e){
 var b=e.target.closest?e.target.closest('.mnItem'):null;
 if(!b){hideMenu();return}
 if(Date.now()-menuAt<250)return;
 hideMenu();openManager(b.getAttribute('data-k'))
});
function gCancel(){clearTimeout(gT);gT=0}
function gTrigger(){gT=0;gLong=true;showMenu()}
globe.style.webkitUserSelect='none';globe.style.userSelect='none';
globe.addEventListener('pointerdown',function(e){gLong=false;gCancel();gX=e.clientX;gY=e.clientY;if(ed.active||PM.kind)return;gT=setTimeout(gTrigger,480)});
globe.addEventListener('pointermove',function(e){if(gT&&(Math.abs(e.clientX-gX)>12||Math.abs(e.clientY-gY)>12))gCancel()});
['pointerup','pointercancel'].forEach(function(n){globe.addEventListener(n,function(){gCancel();if(gLong){gSuppress=Date.now()+400;gLong=false}})});
globe.addEventListener('contextmenu',function(e){e.preventDefault();if(gT){gCancel();gTrigger()}});
updateCase();
})();
</script></body></html>
